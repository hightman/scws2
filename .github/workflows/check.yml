name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            brew install autoconf automake libtool
          else
            sudo apt-get update
            sudo apt-get install -y autoconf automake libtool
          fi
      - run: ./bootstrap.sh
      - run: ./configure && make -j2 && make check
      - run: make dist-gzip
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install core and PHP development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool php-dev
      - name: Install shared core
        run: |
          ./bootstrap.sh
          ./configure --prefix="$RUNNER_TEMP/scws2"
          make -j2
          make install
      - name: Build and test dynamically linked extension
        env:
          NO_INTERACTION: '1'
          REPORT_EXIT_STATUS: '1'
        run: |
          cd phpext
          phpize
          ./configure --with-scws2="$RUNNER_TEMP/scws2"
          make -j2
          make test
